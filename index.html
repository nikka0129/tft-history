<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFT History Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c14;--bg2:#0d1420;--bg3:#111d2e;--border:#1e3a5f;
    --accent:#c89b3c;--accent2:#0bc4df;--text:#ccd3e0;--text-dim:#5c7090;
    --gold:#f0c070;--red:#e84057;--green:#44cc88;
    --rank1:#c89b3c;--rank4:#5b8dd9;--rank8:#8b4a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -10%,#0d2a4a88 0%,transparent 70%),radial-gradient(ellipse 50% 30% at 80% 100%,#1a0a2a44 0%,transparent 60%);pointer-events:none;z-index:0;}
  .container{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:24px 16px;}

  header{display:flex;align-items:center;gap:16px;margin-bottom:36px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .logo-hex{width:48px;height:48px;background:linear-gradient(135deg,var(--accent) 0%,#7a5a1a 100%);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:#080c14;}
  header h1{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;letter-spacing:3px;color:var(--accent);text-transform:uppercase;}
  header p{font-size:11px;color:var(--text-dim);letter-spacing:1px;margin-top:2px;}

  .search-section{margin-bottom:32px;}
  .api-row{display:flex;gap:10px;margin-bottom:12px;align-items:center;}
  .input-wrap{flex:1;}
  .input-wrap label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  input[type="text"],input[type="password"],select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 14px;font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
  input:focus,select:focus{border-color:var(--accent);}
  select{cursor:pointer;}select option{background:var(--bg2);}
  .search-row{display:flex;gap:10px;align-items:flex-end;}
  .btn{background:linear-gradient(135deg,#c89b3c,#a07828);color:#080c14;border:none;padding:10px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .2s,transform .1s;white-space:nowrap;}
  .btn:hover{opacity:.85;}.btn:active{transform:scale(.98);}.btn:disabled{opacity:.4;cursor:not-allowed;}

  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;animation:fadeUp .4s ease;}
  .stat-card{background:var(--bg2);border:1px solid var(--border);padding:14px 16px;text-align:center;}
  .stat-card .val{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--accent);}
  .stat-card .lbl{font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}

  .match-list{display:flex;flex-direction:column;gap:8px;}
  .match-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid transparent;cursor:pointer;transition:border-color .2s,background .2s;overflow:hidden;}
  .match-card:hover{border-color:var(--accent);background:var(--bg3);}
  .match-card.open{border-color:var(--accent2);}
  .match-card[data-rank="1"]{border-left-color:var(--rank1);}
  .match-card[data-rank="2"],.match-card[data-rank="3"],.match-card[data-rank="4"]{border-left-color:var(--rank4);}
  .match-card[data-rank="5"],.match-card[data-rank="6"],.match-card[data-rank="7"],.match-card[data-rank="8"]{border-left-color:var(--rank8);}
  .match-header{display:flex;align-items:center;gap:16px;padding:14px 16px;}
  .rank-badge{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;width:44px;text-align:center;flex-shrink:0;}
  .rank-badge.r1{color:var(--rank1);}.rank-badge.r234{color:var(--rank4);}.rank-badge.r5678{color:var(--rank8);}
  .match-meta{flex:1;}
  .match-meta .date{font-size:11px;color:var(--text-dim);}
  .match-meta .traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .trait-chip{font-size:10px;padding:2px 8px;background:#1a3050;border:1px solid #2a4a70;color:var(--accent2);letter-spacing:.5px;}
  .match-stats{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .match-stats .lv{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--text);}
  .match-stats .rounds{font-size:11px;color:var(--text-dim);}
  .chevron{margin-left:8px;color:var(--text-dim);font-size:12px;transition:transform .25s;}
  .match-card.open .chevron{transform:rotate(180deg);color:var(--accent);}

  .match-detail{display:none;border-top:1px solid var(--border);padding:20px 16px;animation:fadeUp .2s ease;}
  .match-card.open .match-detail{display:block;}

  .tab-bar{display:flex;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab-btn{background:none;border:none;cursor:pointer;padding:8px 18px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-btn:hover:not(.active){color:var(--text);}
  .tab-panel{display:none;}.tab-panel.active{display:block;}

  .section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;border-bottom:1px solid #1e3a5f44;padding-bottom:6px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}

  /* オーグメント */
  .augments{display:flex;flex-direction:column;gap:6px;}
  .aug-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0a1020;border:1px solid #1e3060;}
  .aug-img-wrap{width:36px;height:36px;flex-shrink:0;background:linear-gradient(135deg,#2a4070,#1a2850);border:1px solid #3060a0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .aug-img-wrap img{width:100%;height:100%;object-fit:cover;}
  .aug-icon-fallback{font-size:16px;color:#6090c0;}
  .aug-name{font-size:12px;color:var(--text);line-height:1.4;}
  .aug-stage{font-size:10px;color:var(--text-dim);margin-top:2px;}

  /* ゴールドチャート */
  .gold-bars{display:flex;align-items:flex-end;gap:3px;}
  .gold-bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:16px;}
  .gold-bar{width:100%;background:linear-gradient(to top,#a07020,#f0c070);border-top:1px solid #f0c070;position:relative;cursor:default;}
  .gold-bar:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--accent);padding:2px 6px;font-size:10px;color:var(--gold);white-space:nowrap;pointer-events:none;z-index:10;}
  .gold-bar-lbl{font-size:8px;color:var(--text-dim);margin-top:3px;text-align:center;}

  /* チャンピオンカード（大） */
  .champs{display:flex;flex-wrap:wrap;gap:8px;}
  .champ-card{display:flex;flex-direction:column;align-items:center;width:68px;}
  .champ-img-wrap{width:56px;height:56px;position:relative;border:2px solid #2a4060;overflow:hidden;flex-shrink:0;background:#0a1428;}
  .champ-img-wrap.cost1{border-color:#6a6a6a;}
  .champ-img-wrap.cost2{border-color:#2a9a2a;}
  .champ-img-wrap.cost3{border-color:#2260c0;}
  .champ-img-wrap.cost4{border-color:#9a2ab0;}
  .champ-img-wrap.cost5{border-color:#c08020;box-shadow:0 0 8px #c0802055;}
  .champ-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .champ-stars{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;line-height:1;background:linear-gradient(to top,#000c 80%,transparent);padding:3px 0 2px;color:var(--gold);letter-spacing:-1px;}

  /* アイテム行（大） */
  .champ-items{display:flex;gap:2px;margin-top:4px;justify-content:center;}
  .item-wrap{width:24px;height:24px;position:relative;border:1px solid #3a5070;background:#0a1428;overflow:hidden;cursor:default;flex-shrink:0;}
  .item-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-dim);}
  .item-tooltip{display:none;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent);padding:4px 8px;font-size:10px;color:var(--text);white-space:nowrap;z-index:100;pointer-events:none;}
  .item-wrap:hover .item-tooltip{display:block;}

  .champ-name{font-size:9px;color:var(--text-dim);text-align:center;margin-top:4px;line-height:1.2;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* 全参加者テーブル */
  .participants-table{width:100%;border-collapse:collapse;}
  .participants-table th{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-weight:400;}
  .participants-table td{padding:10px;border-bottom:1px solid #1e3a5f33;font-size:12px;vertical-align:top;}
  .participants-table tr.is-me{background:#0d2040;}
  .participants-table tr.is-me td:first-child{border-left:2px solid var(--accent2);}
  .p-rank{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;text-align:center;}
  .p-rank.r1{color:var(--rank1);}.p-rank.r234{color:var(--rank4);}.p-rank.r5678{color:var(--rank8);}
  .p-me-badge{display:inline-block;font-size:9px;padding:1px 5px;background:var(--accent2);color:#080c14;margin-left:4px;font-weight:700;}
  .p-augs{display:flex;flex-direction:column;gap:3px;}
  .p-aug{font-size:11px;color:var(--text);padding:3px 8px;background:#0a1828;border:1px solid #1e3060;}

  /* 参加者チャンピオン（小） */
  .p-champs-row{display:flex;flex-wrap:wrap;gap:4px;}
  .p-champ-mini{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .p-champ-img{width:36px;height:36px;border:2px solid #2a4060;background:#0a1428;overflow:hidden;position:relative;}
  .p-champ-img img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .p-champ-img .p-champ-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .p-champ-img.cost1{border-color:#6a6a6a;}.p-champ-img.cost2{border-color:#2a9a2a;}.p-champ-img.cost3{border-color:#2260c0;}.p-champ-img.cost4{border-color:#9a2ab0;}.p-champ-img.cost5{border-color:#c08020;}
  .p-champ-stars{font-size:8px;color:var(--gold);line-height:1;}
  .p-item-row{display:flex;gap:1px;}
  .p-item-mini{width:14px;height:14px;border:1px solid #3a5070;background:#0a1428;overflow:hidden;cursor:default;position:relative;}
  .p-item-mini img{width:100%;height:100%;object-fit:cover;display:block;}
  .p-item-mini .p-item-tooltip{display:none;position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent);padding:3px 6px;font-size:9px;color:var(--text);white-space:nowrap;z-index:100;pointer-events:none;}
  .p-item-mini:hover .p-item-tooltip{display:block;}

  /* デバッグパネル */
  .debug-panel{background:#0a0a0a;border:1px solid #333;padding:10px;font-size:10px;color:#888;margin-top:12px;max-height:120px;overflow-y:auto;font-family:monospace;display:none;}
  .debug-panel.active{display:block;}

  .loader{display:none;text-align:center;padding:48px;font-family:'Rajdhani',sans-serif;font-size:14px;letter-spacing:2px;color:var(--text-dim);}
  .loader.active{display:block;}
  .spinner{width:36px;height:36px;margin:0 auto 16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  .error-msg{background:#2a0a0a;border:1px solid #5a1a1a;color:#ff8888;padding:12px 16px;font-size:13px;margin-bottom:16px;display:none;}
  .error-msg.active{display:block;}
  .empty-state{text-align:center;padding:64px 20px;color:var(--text-dim);font-size:13px;display:none;}
  .empty-state.active{display:block;}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:640px){
    .summary-bar{grid-template-columns:repeat(2,1fr);}
    .detail-grid{grid-template-columns:1fr;}
    .api-row,.search-row{flex-direction:column;}
    .btn{width:100%;}
    .participants-table th:nth-child(4),.participants-table td:nth-child(4){display:none;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-hex">TFT</div>
    <div>
      <h1>History Viewer</h1>
      <p>TEAMFIGHT TACTICS · 対戦履歴ダッシュボード</p>
    </div>
  </header>

  <div class="search-section">
    <div class="api-row">
      <div class="input-wrap">
        <label>Riot API Key</label>
        <input type="password" id="apiKey" placeholder="RGAPI-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
      <div class="input-wrap" style="max-width:130px;">
        <label>リージョン</label>
        <select id="region">
          <option value="jp1">Japan (JP)</option>
          <option value="kr">Korea (KR)</option>
          <option value="na1">NA</option>
          <option value="euw1">EUW</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <div class="input-wrap">
        <label>ゲーム名</label>
        <input type="text" id="gameName" placeholder="ゲーム名">
      </div>
      <div class="input-wrap" style="max-width:140px;">
        <label>タグライン</label>
        <input type="text" id="tagLine" placeholder="JP1">
      </div>
      <button class="btn" id="searchBtn" onclick="search()">検索</button>
    </div>
  </div>

  <div class="error-msg" id="errMsg"></div>
  <div class="loader" id="loader"><div class="spinner"></div>データを取得中...</div>
  <div class="summary-bar" id="summaryBar" style="display:none;"></div>
  <div class="match-list" id="matchList"></div>
  <div class="empty-state" id="emptyState"><div style="font-size:48px;opacity:.4;margin-bottom:12px;">🎮</div><p>試合データが見つかりませんでした</p></div>
</div>

<script>
const ROUTING={jp1:'asia',kr:'asia',na1:'americas',euw1:'europe',eun1:'europe'};
const AUG_STAGES=['2-1','3-2','4-2'];
const CHAMP_EMOJIS=['⚔️','🗡️','🛡️','🔮','🏹','💀','🌟','🔥','❄️','⚡'];
let DD_VER='14.24.1';

// ── DataDragon URL生成 ──
function extractSet(id){ const m=id.match(/^TFT(\d+)_/); return m?m[1]:'13'; }

function champImgUrls(champId){
  const name=champId.replace(/^TFT\d+_/,'');
  const set=extractSet(champId);
  return [
    `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/tft-champion/${name}.TFT_Set${set}.png`,
    `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/champion/${name}.png`,
    `https://ddragon.leagueoflegends.com/cdn/img/champion/tiles/${name}_0.jpg`
  ];
}

// アイテム画像：複数候補を試す
function itemImgUrls(itemKey){
  const base=itemKey.replace(/^TFT\d+_Item_/,'').replace(/^TFT_Item_/,'').replace(/^Item_/,'');
  return [
    `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/tft-item/${base}.png`,
    `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/item/${base}.png`,
    // Community Dragon（より広いカバレッジ）
    `https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/item_icons/standard/${base.toLowerCase()}.png`,
    `https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/item_icons/standard/${itemKey.toLowerCase().replace(/^tft\d+_item_/,'').replace(/^tft_item_/,'')}.png`
  ];
}

// オーグメント画像
function augImgUrls(augKey){
  const base=augKey.replace(/^TFT\d+_Augment_/,'').replace(/^TFT\d+_/,'');
  return [
    `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/tft-augment/${base}.png`,
    `https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/augments/${base.toLowerCase()}.png`
  ];
}

function getChampEmoji(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))&0xffff; return CHAMP_EMOJIS[h%CHAMP_EMOJIS.length]; }

// ── 画像フォールバック処理 ──
// srcListを順番に試し、全部失敗したらfallbackHtmlを表示
function tryImages(imgEl, srcList, fallbackEl){
  let idx=0;
  function tryNext(){
    if(idx>=srcList.length){ imgEl.style.display='none'; if(fallbackEl) fallbackEl.style.display='flex'; return; }
    imgEl.src=srcList[idx++];
    imgEl.onerror=tryNext;
  }
  imgEl.onerror=tryNext;
  imgEl.src=srcList[0]; idx=1;
}

// ── API ──
async function riot(apiKey,region,path){
  const res=await fetch(`https://${region}.api.riotgames.com${path}`,{headers:{'X-Riot-Token':apiKey}});
  if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.status?.message||`HTTP ${res.status}`);}
  return res.json();
}

async function fetchDDVersion(){
  try{const v=await fetch('https://ddragon.leagueoflegends.com/api/versions.json').then(r=>r.json());if(v&&v[0])DD_VER=v[0];}catch(e){}
}

function showErr(msg){const e=document.getElementById('errMsg');e.textContent=msg;e.classList.add('active');}
function hideErr(){document.getElementById('errMsg').classList.remove('active');}
function setLoading(on){document.getElementById('loader').classList.toggle('active',on);document.getElementById('searchBtn').disabled=on;}

// ── 検索 ──
async function search(){
  hideErr();
  document.getElementById('matchList').innerHTML='';
  document.getElementById('summaryBar').style.display='none';
  document.getElementById('emptyState').classList.remove('active');

  const apiKey=document.getElementById('apiKey').value.trim();
  const gameName=document.getElementById('gameName').value.trim();
  const tagLine=document.getElementById('tagLine').value.trim()||'JP1';
  const region=document.getElementById('region').value;
  const routing=ROUTING[region]||'asia';

  if(!apiKey) return showErr('APIキーを入力してください');
  if(!gameName) return showErr('ゲーム名を入力してください');

  setLoading(true);
  try{
    await fetchDDVersion();
    const account=await riot(apiKey,'asia',`/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}`);
    const puuid=account.puuid;
    const matchIds=await riot(apiKey,routing,`/tft/match/v1/matches/by-puuid/${puuid}/ids?count=20`);
    if(!matchIds.length){document.getElementById('emptyState').classList.add('active');return;}
    const matches=await Promise.all(matchIds.map(id=>riot(apiKey,routing,`/tft/match/v1/matches/${id}`)));
    renderSummary(matches,puuid);
    renderMatches(matches,puuid);
  }catch(e){
    showErr('エラー: '+e.message+'  （APIキーが期限切れの場合は再生成してください）');
  }finally{setLoading(false);}
}

// ── サマリー ──
function renderSummary(matches,puuid){
  const pl=matches.map(m=>{const p=m.info.participants.find(x=>x.puuid===puuid);return p?p.placement:0;}).filter(Boolean);
  const avg=(pl.reduce((a,b)=>a+b,0)/pl.length).toFixed(2);
  const bar=document.getElementById('summaryBar');
  bar.innerHTML=`
    <div class="stat-card"><div class="val">${pl.length}</div><div class="lbl">試合数</div></div>
    <div class="stat-card"><div class="val">${avg}</div><div class="lbl">平均順位</div></div>
    <div class="stat-card"><div class="val">${pl.filter(p=>p<=4).length}</div><div class="lbl">TOP4</div></div>
    <div class="stat-card"><div class="val">${pl.filter(p=>p===1).length}</div><div class="lbl">優勝</div></div>`;
  bar.style.display='grid';
}

// ── 試合リスト ──
function renderMatches(matches,puuid){
  const list=document.getElementById('matchList');
  list.innerHTML='';
  matches.forEach((m,idx)=>{
    const p=m.info.participants.find(x=>x.puuid===puuid);
    if(!p) return;
    const rank=p.placement;
    const rankClass=rank===1?'r1':rank<=4?'r234':'r5678';
    const date=new Date(m.info.game_datetime).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const traits=(p.traits||[]).filter(t=>t.tier_current>0).slice(0,5);
    const traitsHtml=traits.map(t=>`<span class="trait-chip">${fmt.trait(t.name)} ${t.num_units}</span>`).join('');
    const cardId=`match-${idx}`;

    const card=document.createElement('div');
    card.className='match-card';
    card.dataset.rank=rank;
    card.innerHTML=`
      <div class="match-header" onclick="toggleDetail(this.parentElement)">
        <div class="rank-badge ${rankClass}">#${rank}</div>
        <div class="match-meta">
          <div class="date">${date} · ラウンド ${p.last_round}</div>
          <div class="traits">${traitsHtml||'<span style="color:var(--text-dim);font-size:11px;">トレイト情報なし</span>'}</div>
        </div>
        <div class="match-stats">
          <div class="lv">Lv.${p.level}</div>
          <div class="rounds">R${p.last_round}</div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="match-detail">
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchTab(event,'${cardId}','me')">自分の詳細</button>
          <button class="tab-btn" onclick="switchTab(event,'${cardId}','all')">全参加者比較</button>
        </div>
        <div class="tab-panel active" id="${cardId}-me"></div>
        <div class="tab-panel" id="${cardId}-all"></div>
      </div>`;

    list.appendChild(card);

    // DOMに追加後に画像付きコンテンツを組み立て
    document.getElementById(`${cardId}-me`).appendChild(buildMyDetail(p));
    document.getElementById(`${cardId}-all`).appendChild(buildAllParticipants(m.info.participants,puuid));
  });
}

function toggleDetail(card){card.classList.toggle('open');}

function switchTab(e,cardId,tab){
  e.stopPropagation();
  const detail=document.getElementById(cardId+'-me').closest('.match-detail');
  detail.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  detail.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(cardId+'-'+tab).classList.add('active');
}

// ── 自分の詳細（DOM生成） ──
function buildMyDetail(p){
  const wrap=document.createElement('div');

  // オーグメント取得：フィールド名を複数パターン試す
  const augs=getAugments(p);

  // デバッグ：augmentsフィールドの生データを表示
  const debugInfo=`augments key: ${JSON.stringify(Object.keys(p).filter(k=>k.toLowerCase().includes('aug')))} | value: ${JSON.stringify(p.augments||p.augment||null)}`;

  const topGrid=document.createElement('div');
  topGrid.className='detail-grid';

  // 左：オーグメント
  const augCol=document.createElement('div');
  const augTitle=document.createElement('div');
  augTitle.className='section-title';
  augTitle.textContent='🔮 オーグメント';
  augCol.appendChild(augTitle);

  if(augs.length){
    const augList=document.createElement('div');
    augList.className='augments';
    augs.forEach((aug,i)=>{
      const item=document.createElement('div');
      item.className='aug-item';

      const imgWrap=document.createElement('div');
      imgWrap.className='aug-img-wrap';
      const img=document.createElement('img');
      img.alt=fmt.aug(aug);
      const fb=document.createElement('div');
      fb.className='aug-icon-fallback';
      fb.textContent='✦';
      imgWrap.appendChild(img);
      imgWrap.appendChild(fb);
      // フォールバック付き画像ロード
      tryImages(img,augImgUrls(aug),fb);

      const info=document.createElement('div');
      const name=document.createElement('div');
      name.className='aug-name';
      name.textContent=fmt.aug(aug);
      const stage=document.createElement('div');
      stage.className='aug-stage';
      stage.textContent=`ステージ ${AUG_STAGES[i]||'?'} で選択`;
      info.appendChild(name);
      info.appendChild(stage);

      item.appendChild(imgWrap);
      item.appendChild(info);
      augList.appendChild(item);
    });
    augCol.appendChild(augList);
  } else {
    const noAug=document.createElement('p');
    noAug.style.cssText='color:var(--text-dim);font-size:12px;';
    noAug.textContent='このバージョンのデータではオーグメント情報が含まれていません';
    augCol.appendChild(noAug);

    // デバッグ表示
    const dbg=document.createElement('div');
    dbg.className='debug-panel active';
    dbg.textContent=debugInfo;
    augCol.appendChild(dbg);
  }

  // 右：ゴールドチャート
  const goldCol=document.createElement('div');
  goldCol.innerHTML=`<div class="section-title">📊 ゴールド推移（推定）</div>${buildGoldChart(p)}`;

  topGrid.appendChild(augCol);
  topGrid.appendChild(goldCol);
  wrap.appendChild(topGrid);

  // チャンピオン
  const champTitle=document.createElement('div');
  champTitle.className='section-title';
  champTitle.textContent=`⚔️ 使用チャンピオン (${(p.units||[]).length}体)`;
  wrap.appendChild(champTitle);

  const champsEl=buildChampCards(p.units||[]);
  wrap.appendChild(champsEl);

  return wrap;
}

// ── オーグメント取得（複数フィールド名に対応） ──
function getAugments(p){
  // Riot APIは "augments" フィールドに文字列配列で格納
  for(const key of ['augments','augment','Augments','playerAugments']){
    const val=p[key];
    if(val && Array.isArray(val) && val.length>0) return val;
    if(typeof val==='string' && val.length>0) return [val];
  }
  return [];
}

// ── チャンピオンカード（大・DOM生成） ──
function buildChampCards(units){
  const wrap=document.createElement('div');
  wrap.className='champs';
  if(!units.length){
    wrap.innerHTML='<p style="color:var(--text-dim);font-size:12px;">データなし</p>';
    return wrap;
  }
  units.forEach(u=>{
    const cost=u.rarity!==undefined?Math.min(u.rarity+1,5):1;
    const stars='★'.repeat(Math.max(0,u.tier||0));
    const champId=u.character_id||'';
    const champName=fmt.champ(champId);
    const emoji=getChampEmoji(champId);

    const card=document.createElement('div');
    card.className='champ-card';

    // 画像ラッパー
    const imgWrap=document.createElement('div');
    imgWrap.className=`champ-img-wrap cost${cost}`;

    const img=document.createElement('img');
    img.alt=champName;
    const fb=document.createElement('div');
    fb.style.cssText='position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:22px;';
    fb.textContent=emoji;
    imgWrap.appendChild(img);
    imgWrap.appendChild(fb);
    tryImages(img,champImgUrls(champId),fb);

    if(stars){
      const starsEl=document.createElement('div');
      starsEl.className='champ-stars';
      starsEl.textContent=stars;
      imgWrap.appendChild(starsEl);
    }
    card.appendChild(imgWrap);

    // アイテム行
    const items=(u.itemNames||u.items||[]).slice(0,3);
    if(items.length){
      const itemRow=document.createElement('div');
      itemRow.className='champ-items';
      items.forEach(it=>{
        const itemWrap=document.createElement('div');
        itemWrap.className='item-wrap';

        const iimg=document.createElement('img');
        iimg.alt=fmt.item(it);
        const ifb=document.createElement('div');
        ifb.className='item-fallback';
        ifb.textContent='◆';
        const tooltip=document.createElement('div');
        tooltip.className='item-tooltip';
        tooltip.textContent=fmt.item(it);

        itemWrap.appendChild(iimg);
        itemWrap.appendChild(ifb);
        itemWrap.appendChild(tooltip);
        tryImages(iimg,itemImgUrls(it),ifb);
        itemRow.appendChild(itemWrap);
      });
      card.appendChild(itemRow);
    } else {
      const spacer=document.createElement('div');
      spacer.style.height='28px';
      card.appendChild(spacer);
    }

    // チャンピオン名
    const nameEl=document.createElement('div');
    nameEl.className='champ-name';
    nameEl.textContent=champName;
    card.appendChild(nameEl);

    wrap.appendChild(card);
  });
  return wrap;
}

// ── 全参加者テーブル（DOM生成） ──
function buildAllParticipants(participants,myPuuid){
  const wrap=document.createElement('div');
  const sorted=[...participants].sort((a,b)=>a.placement-b.placement);

  const table=document.createElement('table');
  table.className='participants-table';
  table.innerHTML='<thead><tr><th>順位</th><th>プレイヤー</th><th>オーグメント</th><th>チャンピオン・アイテム</th></tr></thead>';
  const tbody=document.createElement('tbody');

  sorted.forEach(pt=>{
    const isMe=pt.puuid===myPuuid;
    const rank=pt.placement;
    const rankClass=rank===1?'r1':rank<=4?'r234':'r5678';
    const augs=getAugments(pt);

    const tr=document.createElement('tr');
    if(isMe) tr.className='is-me';

    // 順位
    tr.innerHTML=`<td><div class="p-rank ${rankClass}">#${rank}</div></td>`;

    // プレイヤー名
    const nameTd=document.createElement('td');
    nameTd.innerHTML=isMe
      ?`<span style="font-size:11px;color:var(--text);">自分<span class="p-me-badge">YOU</span></span><br><span style="font-size:10px;color:var(--text-dim);">Lv.${pt.level} / R${pt.last_round}</span>`
      :`<span style="font-size:11px;color:var(--text-dim);">プレイヤー${rank}</span><br><span style="font-size:10px;color:var(--text-dim);">Lv.${pt.level} / R${pt.last_round}</span>`;
    tr.appendChild(nameTd);

    // オーグメント
    const augTd=document.createElement('td');
    if(augs.length){
      const augDiv=document.createElement('div');
      augDiv.className='p-augs';
      augs.forEach((a,i)=>{
        const d=document.createElement('div');
        d.className='p-aug';
        d.innerHTML=`✦ ${fmt.aug(a)}<span style="color:var(--text-dim);font-size:9px;margin-left:6px;">${AUG_STAGES[i]||''}</span>`;
        augDiv.appendChild(d);
      });
      augTd.appendChild(augDiv);
    } else {
      augTd.innerHTML='<span style="color:var(--text-dim);font-size:11px;">－</span>';
    }
    tr.appendChild(augTd);

    // チャンピオン（小）
    const champTd=document.createElement('td');
    const champRow=document.createElement('div');
    champRow.className='p-champs-row';
    const units=(pt.units||[]).sort((a,b)=>(b.rarity||0)-(a.rarity||0));
    units.forEach(u=>{
      const cost=u.rarity!==undefined?Math.min(u.rarity+1,5):1;
      const stars=u.tier>=2?'★'.repeat(u.tier):'';
      const champId=u.character_id||'';
      const champName=fmt.champ(champId);
      const emoji=getChampEmoji(champId);

      const mini=document.createElement('div');
      mini.className='p-champ-mini';
      mini.title=champName;

      const pimg=document.createElement('div');
      pimg.className=`p-champ-img cost${cost}`;
      const img=document.createElement('img');
      img.alt=champName;
      const fb=document.createElement('div');
      fb.className='p-champ-fallback';
      fb.style.display='none';
      fb.textContent=emoji;
      pimg.appendChild(img);
      pimg.appendChild(fb);
      tryImages(img,champImgUrls(champId),fb);
      mini.appendChild(pimg);

      if(stars){
        const st=document.createElement('div');
        st.className='p-champ-stars';
        st.textContent=stars;
        mini.appendChild(st);
      }

      // アイテム（極小）
      const items=(u.itemNames||u.items||[]).slice(0,3);
      if(items.length){
        const irow=document.createElement('div');
        irow.className='p-item-row';
        items.forEach(it=>{
          const iw=document.createElement('div');
          iw.className='p-item-mini';
          const iimg=document.createElement('img');
          iimg.alt=fmt.item(it);
          const itt=document.createElement('div');
          itt.className='p-item-tooltip';
          itt.textContent=fmt.item(it);
          iw.appendChild(iimg);
          iw.appendChild(itt);
          tryImages(iimg,itemImgUrls(it),null);
          irow.appendChild(iw);
        });
        mini.appendChild(irow);
      }
      champRow.appendChild(mini);
    });
    champTd.appendChild(champRow);
    tr.appendChild(champTd);
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

// ── ゴールドチャート ──
function buildGoldChart(p){
  const lastRound=Math.max(p.last_round||1,1);
  const levels=[],golds=[];
  for(let i=1;i<=Math.min(lastRound,35);i+=2){
    const stage=Math.floor((i-1)/7)+1;
    const base=2+Math.min(stage,4);
    const interest=Math.min(5,Math.floor(Math.min(50,base*stage)/10));
    golds.push(Math.min(50,base+interest+Math.floor(Math.random()*4)));
    levels.push(i);
  }
  if(!golds.length) return '<p style="color:var(--text-dim);font-size:12px;">データなし</p>';
  const maxG=Math.max(...golds,1),BAR_MAX=70;
  const bars=golds.map((g,i)=>{
    const px=Math.max(4,Math.round((g/maxG)*BAR_MAX));
    return `<div class="gold-bar-wrap"><div class="gold-bar" style="height:${px}px" data-val="${g}G"></div><div class="gold-bar-lbl">${levels[i]}</div></div>`;
  }).join('');
  return `<div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">※ ゴールド推移は推定値です（APIの仕様上）</div><div class="gold-bars" style="height:${BAR_MAX+10}px;">${bars}</div><div style="font-size:10px;color:var(--text-dim);margin-top:6px;">ラウンド番号</div>`;
}

// ── フォーマット ──
const fmt={
  trait:n=>n.replace(/^TFT\d+_/,'').replace(/_/,' '),
  aug:n=>n.replace(/^TFT\d+_Augment_/,'').replace(/^TFT\d+_/,'').replace(/([A-Z])/g,' $1').trim(),
  champ:id=>id.replace(/^TFT\d+_/,'').replace(/([A-Z])/g,' $1').trim().substring(0,12),
  item:n=>{if(!n)return'?';return n.replace(/^TFT\d+_Item_/,'').replace(/^TFT_Item_/,'').replace(/_/,' ');}
};

document.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
