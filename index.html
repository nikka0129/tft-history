<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFT History Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --bg2: #0d1420;
    --bg3: #111d2e;
    --border: #1e3a5f;
    --accent: #c89b3c;
    --accent2: #0bc4df;
    --text: #ccd3e0;
    --text-dim: #5c7090;
    --gold: #f0c070;
    --red: #e84057;
    --green: #44cc88;
    --rank1: #c89b3c;
    --rank4: #5b8dd9;
    --rank8: #8b4a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 背景エフェクト ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% -10%, #0d2a4a88 0%, transparent 70%),
      radial-gradient(ellipse 50% 30% at 80% 100%, #1a0a2a44 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

  /* ── ヘッダー ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo-hex {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent) 0%, #7a5a1a 100%);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700; font-size: 18px; color: #080c14;
  }

  header h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px; font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  header p { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; }

  /* ── 検索エリア ── */
  .search-section { margin-bottom: 32px; }

  .api-row {
    display: flex; gap: 10px; margin-bottom: 12px; align-items: center;
  }

  .input-wrap {
    flex: 1; position: relative;
  }

  .input-wrap label {
    display: block;
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }

  input[type="text"], input[type="password"], select {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }

  input[type="text"]:focus, input[type="password"]:focus, select:focus {
    border-color: var(--accent);
  }

  select { cursor: pointer; }
  select option { background: var(--bg2); }

  .search-row { display: flex; gap: 10px; align-items: flex-end; }

  .btn {
    background: linear-gradient(135deg, #c89b3c, #a07828);
    color: #080c14;
    border: none;
    padding: 10px 24px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700; font-size: 14px;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    white-space: nowrap;
  }

  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn-sm {
    padding: 6px 14px; font-size: 12px;
  }

  /* ── サマリーカード ── */
  .summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 28px;
    animation: fadeUp .4s ease;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 14px 16px;
    text-align: center;
  }

  .stat-card .val {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px; font-weight: 700;
    color: var(--accent);
  }

  .stat-card .lbl {
    font-size: 10px; letter-spacing: 1px; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  /* ── 試合リスト ── */
  .match-list { display: flex; flex-direction: column; gap: 8px; }

  .match-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    overflow: hidden;
  }

  .match-card:hover { border-color: var(--accent); background: var(--bg3); }
  .match-card.open { border-color: var(--accent2); }

  .match-card[data-rank="1"] { border-left-color: var(--rank1); }
  .match-card[data-rank="2"], .match-card[data-rank="3"], .match-card[data-rank="4"] { border-left-color: var(--rank4); }
  .match-card[data-rank="5"], .match-card[data-rank="6"], .match-card[data-rank="7"], .match-card[data-rank="8"] { border-left-color: var(--rank8); }

  .match-header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px;
  }

  .rank-badge {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px; font-weight: 700;
    width: 44px; text-align: center; flex-shrink: 0;
  }

  .rank-badge.r1 { color: var(--rank1); }
  .rank-badge.r234 { color: var(--rank4); }
  .rank-badge.r5678 { color: var(--rank8); }

  .match-meta { flex: 1; }

  .match-meta .date { font-size: 11px; color: var(--text-dim); }

  .match-meta .traits {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
  }

  .trait-chip {
    font-size: 10px; padding: 2px 8px;
    background: #1a3050; border: 1px solid #2a4a70;
    color: var(--accent2); letter-spacing: .5px;
  }

  .match-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  .match-stats .hp {
    font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700;
  }

  .match-stats .hp.alive { color: var(--green); }
  .match-stats .hp.dead { color: var(--red); }

  .match-stats .rounds { font-size: 11px; color: var(--text-dim); }

  .chevron {
    margin-left: 8px; color: var(--text-dim); font-size: 12px;
    transition: transform .25s;
  }

  .match-card.open .chevron { transform: rotate(180deg); color: var(--accent); }

  /* ── 詳細パネル ── */
  .match-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px 16px;
    animation: fadeUp .2s ease;
  }

  .match-card.open .match-detail { display: block; }

  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }

  .section-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
    border-bottom: 1px solid #1e3a5f44; padding-bottom: 6px;
  }

  /* オーグメント */
  .augments { display: flex; flex-direction: column; gap: 6px; }

  .aug-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: #0a1020; border: 1px solid #1e3060;
  }

  .aug-icon {
    width: 28px; height: 28px; flex-shrink: 0;
    background: linear-gradient(135deg, #2a4070, #1a2850);
    border: 1px solid #3060a0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .aug-name { font-size: 12px; color: var(--text); }
  .aug-stage { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* ゴールドチャート */
  .gold-chart { width: 100%; overflow-x: auto; }

  .gold-bars { display: flex; align-items: flex-end; gap: 3px; height: 80px; }

  .gold-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 18px; }

  .gold-bar {
    width: 100%; background: linear-gradient(to top, #a07020, #f0c070);
    border-top: 1px solid #f0c070;
    transition: height .4s ease;
    cursor: default;
    position: relative;
  }

  .gold-bar:hover::after {
    content: attr(data-val);
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    background: var(--bg); border: 1px solid var(--accent);
    padding: 2px 6px; font-size: 10px; color: var(--gold);
    white-space: nowrap; pointer-events: none;
  }

  .gold-bar-lbl { font-size: 8px; color: var(--text-dim); margin-top: 3px; text-align: center; }

  /* チャンピオン */
  .champs { display: flex; flex-wrap: wrap; gap: 6px; }

  .champ-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    width: 52px;
  }

  .champ-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #1e3050, #0a1825);
    border: 2px solid #2a4060;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; position: relative; overflow: hidden;
  }

  .champ-icon img { width: 100%; height: 100%; object-fit: cover; }

  .champ-cost-1 { border-color: #888; }
  .champ-cost-2 { border-color: #2a9a2a; }
  .champ-cost-3 { border-color: #2260c0; }
  .champ-cost-4 { border-color: #9a2ab0; }
  .champ-cost-5 { border-color: #c08020; }

  .champ-name { font-size: 9px; color: var(--text-dim); text-align: center; line-height: 1.2; }

  .champ-stars { color: var(--gold); font-size: 9px; }

  .items-row { display: flex; gap: 2px; margin-top: 2px; }

  .item-dot {
    width: 12px; height: 12px; border-radius: 2px;
    background: #2a4060; border: 1px solid #3a5070;
    font-size: 7px; display: flex; align-items: center; justify-content: center;
  }

  /* ローディング */
  .loader {
    display: none;
    text-align: center; padding: 48px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; letter-spacing: 2px; color: var(--text-dim);
  }

  .loader.active { display: block; }

  .spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  .error-msg {
    background: #2a0a0a; border: 1px solid #5a1a1a;
    color: #ff8888; padding: 12px 16px; font-size: 13px;
    margin-bottom: 16px; display: none;
  }

  .error-msg.active { display: block; }

  .empty-state {
    text-align: center; padding: 64px 20px;
    color: var(--text-dim); font-size: 13px; display: none;
  }

  .empty-state.active { display: block; }

  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* レスポンシブ */
  @media (max-width: 600px) {
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .detail-grid { grid-template-columns: 1fr; }
    .api-row { flex-direction: column; }
    .search-row { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- ヘッダー -->
  <header>
    <div class="logo-hex">TFT</div>
    <div>
      <h1>History Viewer</h1>
      <p>TEAMFIGHT TACTICS · 対戦履歴ダッシュボード</p>
    </div>
  </header>

  <!-- 検索 -->
  <div class="search-section">
    <div class="api-row">
      <div class="input-wrap">
        <label>Riot API Key</label>
        <input type="password" id="apiKey" placeholder="RGAPI-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
      <div class="input-wrap" style="max-width:130px;">
        <label>リージョン</label>
        <select id="region">
          <option value="jp1">Japan (JP)</option>
          <option value="kr">Korea (KR)</option>
          <option value="na1">NA</option>
          <option value="euw1">EUW</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <div class="input-wrap">
        <label>ゲーム名</label>
        <input type="text" id="gameName" placeholder="ゲーム名">
      </div>
      <div class="input-wrap" style="max-width: 140px;">
        <label>タグライン</label>
        <input type="text" id="tagLine" placeholder="JP1">
      </div>
      <button class="btn" id="searchBtn" onclick="search()">検索</button>
    </div>
  </div>

  <div class="error-msg" id="errMsg"></div>

  <!-- ローダー -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    データを取得中...
  </div>

  <!-- サマリー -->
  <div class="summary-bar" id="summaryBar" style="display:none;"></div>

  <!-- 試合リスト -->
  <div class="match-list" id="matchList"></div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🎮</div>
    <p>試合データが見つかりませんでした</p>
  </div>

</div>

<script>
// リージョン → ルーティングリージョンのマッピング
const ROUTING = {
  jp1: 'asia', kr: 'asia',
  na1: 'americas', euw1: 'europe', eun1: 'europe'
};

// コスト別ボーダー
const COST_CLASS = ['','champ-cost-1','champ-cost-2','champ-cost-3','champ-cost-4','champ-cost-5'];

let allMatches = [];

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg; el.classList.add('active');
}

function hideErr() {
  document.getElementById('errMsg').classList.remove('active');
}

function setLoading(on) {
  document.getElementById('loader').classList.toggle('active', on);
  document.getElementById('searchBtn').disabled = on;
}

async function riot(apiKey, region, path) {
  const url = `https://${region}.api.riotgames.com${path}`;
  const res = await fetch(url, { headers: { 'X-Riot-Token': apiKey } });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.status?.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function search() {
  hideErr();
  document.getElementById('matchList').innerHTML = '';
  document.getElementById('summaryBar').style.display = 'none';
  document.getElementById('emptyState').classList.remove('active');

  const apiKey   = document.getElementById('apiKey').value.trim();
  const gameName = document.getElementById('gameName').value.trim();
  const tagLine  = document.getElementById('tagLine').value.trim() || 'JP1';
  const region   = document.getElementById('region').value;
  const routing  = ROUTING[region] || 'asia';

  if (!apiKey)   return showErr('APIキーを入力してください');
  if (!gameName) return showErr('ゲーム名を入力してください');

  setLoading(true);

  try {
    // 1. PUUID取得
    const account = await riot(apiKey, 'asia', `/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}`);
    const puuid = account.puuid;

    // 2. 試合ID一覧
    const matchIds = await riot(apiKey, routing, `/tft/match/v1/matches/by-puuid/${puuid}/ids?count=20`);

    if (!matchIds.length) {
      document.getElementById('emptyState').classList.add('active');
      return;
    }

    // 3. 各試合の詳細を並列取得
    const matches = await Promise.all(
      matchIds.map(id => riot(apiKey, routing, `/tft/match/v1/matches/${id}`))
    );

    allMatches = matches;
    renderSummary(matches, puuid);
    renderMatches(matches, puuid);

  } catch(e) {
    showErr('エラー: ' + e.message + '  （APIキーが期限切れの場合は再生成してください）');
  } finally {
    setLoading(false);
  }
}

function renderSummary(matches, puuid) {
  const placements = matches.map(m => {
    const p = m.info.participants.find(x => x.puuid === puuid);
    return p ? p.placement : 0;
  }).filter(Boolean);

  const avg = (placements.reduce((a,b)=>a+b,0) / placements.length).toFixed(2);
  const top4 = placements.filter(p => p <= 4).length;
  const wins = placements.filter(p => p === 1).length;

  const bar = document.getElementById('summaryBar');
  bar.innerHTML = `
    <div class="stat-card"><div class="val">${placements.length}</div><div class="lbl">試合数</div></div>
    <div class="stat-card"><div class="val">${avg}</div><div class="lbl">平均順位</div></div>
    <div class="stat-card"><div class="val">${top4}</div><div class="lbl">TOP4</div></div>
    <div class="stat-card"><div class="val">${wins}</div><div class="lbl">優勝</div></div>
  `;
  bar.style.display = 'grid';
}

function renderMatches(matches, puuid) {
  const list = document.getElementById('matchList');
  list.innerHTML = '';

  matches.forEach((m, idx) => {
    const p = m.info.participants.find(x => x.puuid === puuid);
    if (!p) return;

    const rank = p.placement;
    const rankClass = rank === 1 ? 'r1' : rank <= 4 ? 'r234' : 'r5678';
    const date = new Date(m.info.game_datetime).toLocaleDateString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const traits = (p.traits || []).filter(t => t.tier_current > 0).slice(0, 5);

    const traitsHtml = traits.map(t =>
      `<span class="trait-chip">${formatTrait(t.name)} ${t.num_units}</span>`
    ).join('');

    const hpColor = p.last_round > 28 ? 'alive' : 'dead';

    const card = document.createElement('div');
    card.className = 'match-card';
    card.dataset.rank = rank;
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="match-header" onclick="toggleDetail(this.parentElement)">
        <div class="rank-badge ${rankClass}">#${rank}</div>
        <div class="match-meta">
          <div class="date">${date} · ラウンド ${p.last_round}</div>
          <div class="traits">${traitsHtml || '<span style="color:var(--text-dim);font-size:11px;">トレイト情報なし</span>'}</div>
        </div>
        <div class="match-stats">
          <div class="hp ${hpColor}">HP ${p.last_round > 28 ? p.players_eliminated ?? '?' : 0} 残</div>
          <div class="rounds">Lv.${p.level}</div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="match-detail">
        ${buildDetail(p)}
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleDetail(card) {
  card.classList.toggle('open');
}

function buildDetail(p) {
  // オーグメント：APIは augments フィールドに文字列配列で格納
  const augs = p.augments || p.augment || [];
  const augArr = Array.isArray(augs) ? augs : [augs];
  const augStages = ['2-1', '3-2', '4-2'];
  const augsHtml = augArr.length ? augArr.map((aug, i) => `
    <div class="aug-item">
      <div class="aug-icon">✦</div>
      <div>
        <div class="aug-name">${formatAugment(aug)}</div>
        <div class="aug-stage">ステージ ${augStages[i] || '?'} で選択</div>
      </div>
    </div>
  `).join('') : '<p style="color:var(--text-dim);font-size:12px;">このバージョンのデータではオーグメント情報が含まれていません</p>';

  // ゴールドチャート（ラウンドデータが無い場合は推定）
  const goldHtml = buildGoldChart(p);

  // チャンピオン
  const units = p.units || [];
  const champsHtml = units.map(u => {
    const stars = '★'.repeat(u.tier);
    const items = (u.itemNames || u.items || []).slice(0, 3);
    const itemDots = items.map(it => `<div class="item-dot" title="${formatItem(it)}">◆</div>`).join('');
    const cost = u.rarity !== undefined ? Math.min(u.rarity + 1, 5) : 1;
    return `
      <div class="champ-item">
        <div class="champ-icon ${COST_CLASS[cost]}">${getChampEmoji(u.character_id)}</div>
        <div class="champ-stars">${stars}</div>
        <div class="champ-name">${formatChamp(u.character_id)}</div>
        <div class="items-row">${itemDots}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="detail-grid">
      <div>
        <div class="section-title">🔮 オーグメント</div>
        <div class="augments">${augsHtml}</div>
      </div>
      <div>
        <div class="section-title">📊 ゴールド推移（推定）</div>
        <div class="gold-chart">${goldHtml}</div>
      </div>
    </div>
    <div style="margin-top:20px;">
      <div class="section-title">⚔️ 使用チャンピオン (${units.length}体)</div>
      <div class="champs">${champsHtml || '<p style="color:var(--text-dim);font-size:12px;">データなし</p>'}</div>
    </div>
  `;
}

function buildGoldChart(p) {
  // TFT APIは詳細ラウンドデータを提供しないため、last_round・levelから推定
  const lastRound = Math.max(p.last_round || 1, 1);
  const levels = [];
  const golds = [];

  for (let i = 1; i <= Math.min(lastRound, 35); i += 2) {
    const stage = Math.floor((i - 1) / 7) + 1;
    const base = 2 + Math.min(stage, 4);
    const interest = Math.min(5, Math.floor(Math.min(50, base * stage) / 10));
    const est = Math.min(50, base + interest + Math.floor(Math.random() * 4));
    golds.push(est);
    levels.push(i);
  }

  if (golds.length === 0) {
    return '<p style="color:var(--text-dim);font-size:12px;">データなし</p>';
  }

  const maxG = Math.max(...golds, 1);
  const BAR_MAX_PX = 70;

  const barsHtml = golds.map((g, i) => {
    const px = Math.max(4, Math.round((g / maxG) * BAR_MAX_PX));
    return `
      <div class="gold-bar-wrap">
        <div class="gold-bar" style="height:${px}px;" data-val="${g}G"></div>
        <div class="gold-bar-lbl">${levels[i]}</div>
      </div>
    `;
  }).join('');

  return `
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">※ ゴールド推移は推定値です（APIの仕様上）</div>
    <div class="gold-bars" style="height:${BAR_MAX_PX + 10}px;">${barsHtml}</div>
    <div style="font-size:10px;color:var(--text-dim);margin-top:6px;">ラウンド番号</div>
  `;
}

// 文字列整形ユーティリティ
function formatTrait(name) {
  return name.replace(/^TFT\d+_/,'').replace(/_/,' ');
}

function formatAugment(name) {
  return name.replace(/^TFT\d+_/,'').replace(/([A-Z])/g,' $1').trim();
}

function formatChamp(id) {
  const s = id.replace(/^TFT\d+_/,'');
  return s.replace(/([A-Z])/g,' $1').trim().substring(0,10);
}

function formatItem(name) {
  if (!name) return '?';
  return name.replace(/^TFT\d+_Item_/,'').replace(/_/,' ');
}

// チャンピオンの簡易絵文字（コスト色で識別）
const CHAMP_EMOJIS = ['⚔️','🗡️','🛡️','🔮','🏹','💀','🌟','🔥','❄️','⚡'];
function getChampEmoji(id) {
  let hash = 0;
  for (let c of id) hash = (hash * 31 + c.charCodeAt(0)) & 0xffff;
  return CHAMP_EMOJIS[hash % CHAMP_EMOJIS.length];
}

// Enterキーで検索
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
